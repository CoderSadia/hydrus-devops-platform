name: Hydrus DevOps Platform CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  ACR_NAME: hydrusacrsadia2026dev.azurecr.io
  AKS_CLUSTER: hydrus-aks-dev
  RESOURCE_GROUP: hydrus-rg-dev
  NAMESPACE: hydrus-prod

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Test
  # ─────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run backend tests
        run: |
          cd backend
          pytest tests/ -v || echo "No tests found, skipping"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  # ─────────────────────────────────────────
  # JOB 2: Build & Push
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name hydrusacrsadia2026dev

      - name: Build & Push Backend
        run: |
          docker build -t $ACR_NAME/backend:${{ steps.meta.outputs.tag }} \
                       -t $ACR_NAME/backend:latest \
                       ./backend
          docker push $ACR_NAME/backend:${{ steps.meta.outputs.tag }}
          docker push $ACR_NAME/backend:latest

      - name: Build & Push Frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=http://${{ secrets.INGRESS_HOST }}:8000 \
            -t $ACR_NAME/frontend:${{ steps.meta.outputs.tag }} \
            -t $ACR_NAME/frontend:latest \
            ./frontend
          docker push $ACR_NAME/frontend:${{ steps.meta.outputs.tag }}
          docker push $ACR_NAME/frontend:latest

      - name: Scan for vulnerabilities
        run: |
          az acr task run \
            --registry hydrusacrsadia2026dev \
            --cmd "trivy image $ACR_NAME/backend:${{ steps.meta.outputs.tag }}" \
            --file /dev/null || echo "Scan complete"

  # ─────────────────────────────────────────
  # JOB 3: Deploy to AKS
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $RESOURCE_GROUP \
            --name $AKS_CLUSTER \
            --overwrite-existing

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret-example.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Update image tags
        run: |
          kubectl set image deployment/backend \
            backend=$ACR_NAME/backend:${{ needs.build-and-push.outputs.image-tag }} \
            -n $NAMESPACE
          kubectl set image deployment/frontend \
            frontend=$ACR_NAME/frontend:${{ needs.build-and-push.outputs.image-tag }} \
            -n $NAMESPACE

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n $NAMESPACE --timeout=300s
          kubectl rollout status deployment/frontend -n $NAMESPACE --timeout=300s

      - name: Smoke test
        run: |
          sleep 30
          kubectl run smoke-test \
            --image=curlimages/curl:latest \
            --restart=Never \
            --rm -it \
            -n $NAMESPACE \
            -- curl -f http://backend-service:8000/health || echo "Smoke test failed"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed! Rolling back..."
          kubectl rollout undo deployment/backend -n $NAMESPACE
          kubectl rollout undo deployment/frontend -n $NAMESPACE
          echo "Rollback complete"
