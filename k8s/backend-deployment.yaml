apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hydrus-prod
  labels:
    app: backend
    project: hydrus-devops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: hydrusacrsadia2026dev.azurecr.io/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: hydrus-config
            - secretRef:
                name: hydrus-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
